baseURL = 'https://marcelofonseca.me/'
title = 'Marcelo Fonseca'
theme = 'hugo-blog-awesome'
languageCode = 'pt-BR'
defaultContentLanguage = 'pt-BR'
defaultContentLanguageInSubdir = true
disableDefaultLanguageRedirect = false

[languages]

  [languages.pt-BR]
    disabled = false
    languageCode = 'pt-BR'
    languageName = 'Português'
    title = 'Marcelo Fonseca'
    weight = 1

    [[languages.pt-BR.menu.main]]
      name = 'Início'
      pageRef = '/'
      weight = 10
    [[languages.pt-BR.menu.main]]
      name = 'Blog'
      pageRef = '/posts'
      weight = 20
    [[languages.pt-BR.menu.main]]
      name = 'Projetos'
      pageRef = 'projetos'
      weight = 30

    [languages.pt-BR.params]

      [languages.pt-BR.params.author]
        avatar = 'avatar.jpg'
        intro = 'Marcelo Fonseca'
        name = 'Marcelo Fonseca'
        description = 'Sou Marcelo Fonseca, Cientista de Dados. Neste blog compartilho insights, projetos e aprendizados sobre dados, tecnologia e além 👋'

  [languages.en-US]
    disabled = false
    languageCode = 'en-US'
    languageName = 'English'
    title = 'Marcelo Fonseca'
    weight = 2

    [[languages.en-US.menu.main]]
      name = 'Home'
      pageRef = '/'
      weight = 10
    [[languages.en-US.menu.main]]
      name = 'Blog'
      pageRef = '/posts'
      weight = 20
    [[languages.en-US.menu.main]]
      name = 'Projects'
      pageRef = 'projects'
      weight = 30

    [languages.en-US.params]
      
      [languages.en-US.params.author]
        avatar = 'avatar.jpg'
        intro = 'Marcelo Fonseca'
        name = 'Marcelo Fonseca'
        description = "I'm Marcelo Fonseca, a Data Scientist. In this blog, I share insights, projects, and lessons about data, technology, and more 👋"

[frontmatter]
  lastmod = ["lastmod", ":git", "date"]

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[params]
  goToTop = true
  showLanguageSwitcher = true
  toc = true
  tocOpen = true

  [[params.socialIcons]]
  name = "github"
  url = "https://github.com/marcelohfonseca"

  [[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/marcelohfonseca/"

  [[params.socialIcons]]
  name = "Rss"
  url = "/pt-br/index.xml"

  enableGitInfo = true

[taxonomies]
  category = "categories"
  tag = "tags"
